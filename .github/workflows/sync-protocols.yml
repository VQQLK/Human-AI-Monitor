name: Sync protocols from production API

on:
  schedule:
    # Monday and Friday at 08:00 UTC — publish main protocols to GitHub
    - cron: '0 8 * * 1'  # Monday (weekend summary)
    - cron: '0 8 * * 5'  # Friday (mid-week update)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch list of protocols
        id: list
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          curl -sSf "$API/protocols" -o /tmp/protocols.json
          # Extract both week_start (for API URL) and week_end (for filename)
          PAIRS=$(jq -r '.protocols[] | "\(.week_start) \(.week_end)"' /tmp/protocols.json)
          # Encode as single line for GITHUB_OUTPUT
          PAIRS_ENCODED=$(echo "$PAIRS" | base64 -w 0)
          echo "pairs=$PAIRS_ENCODED" >> "$GITHUB_OUTPUT"
          echo "Protocol pairs found:"
          echo "$PAIRS"

      - name: Sync protocol markdown files
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          mkdir -p data/protocols
          # Decode pairs (each line: "week_start week_end")
          PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
          echo "$PAIRS" | while read -r week_start week_end; do
            [ -z "$week_start" ] && continue
            # Filename uses week_end (Sunday) for human readability
            TARGET="data/protocols/${week_end}.md"
            # API uses week_start (Monday) as canonical identifier
            TMP="$(mktemp)"
            if ! curl -sSf "$API/protocols/${week_start}/content" -o "$TMP"; then
              echo "✗ Failed to fetch week_start=${week_start}"
              rm -f "$TMP"
              continue
            fi
            if [ -f "$TARGET" ] && cmp -s "$TMP" "$TARGET"; then
              echo "= ${week_end}.md unchanged (week ${week_start} → ${week_end})"
            else
              mv "$TMP" "$TARGET"
              echo "✓ ${week_end}.md updated (week ${week_start} → ${week_end})"
            fi
            rm -f "$TMP"
          done

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/protocols/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "chore(protocols): sync from API — ${CHANGED} [skip ci]"
          git push
