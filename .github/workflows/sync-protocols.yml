name: Sync protocols (dual-sync: collector + archive)

on:
  schedule:
    - cron: "0 14 * * 1"
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout collector repository
        uses: actions/checkout@v5
        with:
          path: collector

      - name: Checkout archive repository
        uses: actions/checkout@v5
        with:
          repository: VQQLK/human-ai-monitor-archive
          token: ${{ secrets.DUAL_SYNC_TOKEN }}
          path: archive

      - name: Fetch list of protocols
        id: list
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          curl -sSf "$API/protocols" -o /tmp/protocols.json
          PAIRS=$(jq -r '.protocols[] | "\(.week_start) \(.week_end) \(.is_interim // 0)"' /tmp/protocols.json)
          PAIRS_ENCODED=$(echo "$PAIRS" | base64 -w 0)
          echo "pairs=$PAIRS_ENCODED" >> "$GITHUB_OUTPUT"
          echo "Protocol pairs found:"
          echo "$PAIRS"
          
          LATEST_FINAL=$(echo "$PAIRS" | awk '$3 == "0" {print $1}' | sort -r | head -1)
          LATEST_INTERIM=$(echo "$PAIRS" | awk '$3 == "1" {print $1}' | sort -r | head -1)
          echo "Latest FINAL: $LATEST_FINAL"
          echo "Latest INTERIM: $LATEST_INTERIM"
          echo "latest_final=$LATEST_FINAL" >> "$GITHUB_OUTPUT"
          echo "latest_interim=$LATEST_INTERIM" >> "$GITHUB_OUTPUT"

      - name: Sync to archive (ALL protocols)
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          mkdir -p archive/protocols
          cd archive/protocols
          
          echo "Syncing ALL protocols to archive..."
          PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
          
          echo "$PAIRS" | while read -r week_start week_end is_interim; do
            [ -z "$week_start" ] && continue
            
            if [ "$is_interim" = "1" ]; then
              BASENAME="${week_end}.interim"
              TYPE="INTERIM"
            else
              BASENAME="${week_end}"
              TYPE="FINAL"
            fi
            
            for lang in "" ".ru" ".zh"; do
              SUFFIX="${lang}.md"
              if [ -z "$lang" ]; then
                URL="$API/protocols/${week_start}/content"
              else
                URL="$API/protocols/${week_start}/content${lang}"
              fi
              
              TMP="$(mktemp)"
              if curl -sSf "$URL" -o "$TMP"; then
                TARGET="${BASENAME}${SUFFIX}"
                if [ -f "$TARGET" ] && cmp -s "$TMP" "$TARGET"; then
                  echo "= ${TARGET} (${TYPE}) unchanged"
                else
                  mv "$TMP" "$TARGET"
                  echo "✓ ${TARGET} (${TYPE}) updated"
                fi
              else
                echo "⚠ Failed to fetch ${lang:-EN} for ${week_start}"
                rm -f "$TMP"
              fi
            done
          done

      - name: Sync to collector (latest 2 protocols only)
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          mkdir -p collector/data/protocols
          cd collector/data/protocols
          
          LATEST_FINAL="${{ steps.list.outputs.latest_final }}"
          LATEST_INTERIM="${{ steps.list.outputs.latest_interim }}"
          
          echo "Syncing only latest protocols to collector..."
          echo "Latest FINAL: $LATEST_FINAL"
          echo "Latest INTERIM: $LATEST_INTERIM"
          
          # Remove ALL existing protocols (will re-add only latest)
          rm -f *.md
          
          PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
          
          echo "$PAIRS" | while read -r week_start week_end is_interim; do
            [ -z "$week_start" ] && continue
            
            # Skip if not latest FINAL or INTERIM
            if [ "$week_start" != "$LATEST_FINAL" ] && [ "$week_start" != "$LATEST_INTERIM" ]; then
              continue
            fi
            
            if [ "$is_interim" = "1" ]; then
              BASENAME="${week_end}.interim"
              TYPE="INTERIM"
            else
              BASENAME="${week_end}"
              TYPE="FINAL"
            fi
            
            echo "=== Syncing $TYPE ($week_start) ==="
            
            for lang in "" ".ru" ".zh"; do
              SUFFIX="${lang}.md"
              if [ -z "$lang" ]; then
                URL="$API/protocols/${week_start}/content"
              else
                URL="$API/protocols/${week_start}/content${lang}"
              fi
              
              if curl -sSf "$URL" -o "${BASENAME}${SUFFIX}"; then
                echo "✓ ${BASENAME}${SUFFIX} synced"
              else
                echo "⚠ Failed ${lang:-EN} for ${week_start}"
              fi
            done
          done
          
          echo "=== Final collector state ==="
          ls -la

      - name: Commit and push archive
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocols/
          if git diff --cached --quiet; then
            echo "No changes in archive"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "chore(protocols): archive update — ${CHANGED} [skip ci]"
          git push

      - name: Commit and push collector
        working-directory: collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/protocols/
          if git diff --cached --quiet; then
            echo "No changes in collector"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "chore(protocols): sync latest — ${CHANGED} [skip ci]"
          git push
