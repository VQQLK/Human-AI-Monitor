name: Sync protocols from production API

on:
  schedule:
    # Monday at 14:00 UTC — after final protocol generated at 13:45 UTC
    - cron: "0 14 * * 1"
    # Saturday at 08:00 UTC — after Friday interim protocol generated at 13:45 Fri
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch list of protocols
        id: list
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          curl -sSf "$API/protocols" -o /tmp/protocols.json
          PAIRS=$(jq -r ".protocols[] | "\(.week_start) \(.week_end) \(.is_interim // 0)"" /tmp/protocols.json)
          PAIRS_ENCODED=$(echo "$PAIRS" | base64 -w 0)
          echo "pairs=$PAIRS_ENCODED" >> "$GITHUB_OUTPUT"
          echo "Protocol pairs found:"
          echo "$PAIRS"

      - name: Sync protocol markdown files
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          mkdir -p data/protocols
          PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
          echo "$PAIRS" | while read -r week_start week_end is_interim; do
            [ -z "$week_start" ] && continue
            
            if [ "$is_interim" = "1" ]; then
              TARGET="data/protocols/${week_end}.interim.md"
              TYPE="INTERIM"
            else
              TARGET="data/protocols/${week_end}.md"
              TYPE="FINAL"
            fi
            
            TMP="$(mktemp)"
            if ! curl -sSf "$API/protocols/${week_start}/content" -o "$TMP"; then
              echo "✗ Failed to fetch week_start=${week_start}"
              rm -f "$TMP"
              continue
            fi
            if [ -f "$TARGET" ] && cmp -s "$TMP" "$TARGET"; then
              echo "= ${week_end} ($TYPE) unchanged"
            else
              mv "$TMP" "$TARGET"
              echo "✓ ${week_end} ($TYPE) updated"
            fi
            rm -f "$TMP"
          done

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/protocols/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | tr "\n" " ")
          git commit -m "chore(protocols): sync from API — ${CHANGED} [skip ci]"
          git push
