name: Sync protocols from production API

on:
  schedule:
    # Monday at 14:00 UTC — after final protocol generated at 13:45 UTC
    - cron: "0 14 * * 1"
    # Saturday at 08:00 UTC — after Friday interim protocol generated at 13:45 Fri
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch list of protocols
        id: list
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          curl -sSf "$API/protocols" -o /tmp/protocols.json
          PAIRS=$(jq -r '.protocols[] | "\(.week_start) \(.week_end) \(.is_interim // 0)"' /tmp/protocols.json)
          PAIRS_ENCODED=$(echo "$PAIRS" | base64 -w 0)
          echo "pairs=$PAIRS_ENCODED" >> "$GITHUB_OUTPUT"
          echo "Protocol pairs found:"
          echo "$PAIRS"

      - name: Sync protocol markdown files (all 3 languages)
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          mkdir -p data/protocols
          PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
          echo "$PAIRS" | while read -r week_start week_end is_interim; do
            [ -z "$week_start" ] && continue
            
            # Determine base filename and type
            if [ "$is_interim" = "1" ]; then
              BASENAME="${week_end}.interim"
              TYPE="INTERIM"
            else
              BASENAME="${week_end}"
              TYPE="FINAL"
            fi
            
            # Sync English
            TMP_EN="$(mktemp)"
            if curl -sSf "$API/protocols/${week_start}/content" -o "$TMP_EN"; then
              TARGET_EN="data/protocols/${BASENAME}.md"
              if [ -f "$TARGET_EN" ] && cmp -s "$TMP_EN" "$TARGET_EN"; then
                echo "= ${BASENAME}.md ($TYPE, EN) unchanged"
              else
                mv "$TMP_EN" "$TARGET_EN"
                echo "✓ ${BASENAME}.md ($TYPE, EN) updated"
              fi
            else
              echo "✗ Failed to fetch EN content for ${week_start}"
              rm -f "$TMP_EN"
            fi
            
            # Sync Russian
            TMP_RU="$(mktemp)"
            if curl -sSf "$API/protocols/${week_start}/content/ru" -o "$TMP_RU"; then
              TARGET_RU="data/protocols/${BASENAME}.ru.md"
              if [ -f "$TARGET_RU" ] && cmp -s "$TMP_RU" "$TARGET_RU"; then
                echo "= ${BASENAME}.ru.md ($TYPE, RU) unchanged"
              else
                mv "$TMP_RU" "$TARGET_RU"
                echo "✓ ${BASENAME}.ru.md ($TYPE, RU) updated"
              fi
            else
              echo "⚠ RU not ready for ${week_start} (may not be translated yet)"
              rm -f "$TMP_RU"
            fi
            
            # Sync Chinese
            TMP_ZH="$(mktemp)"
            if curl -sSf "$API/protocols/${week_start}/content/zh" -o "$TMP_ZH"; then
              TARGET_ZH="data/protocols/${BASENAME}.zh.md"
              if [ -f "$TARGET_ZH" ] && cmp -s "$TMP_ZH" "$TARGET_ZH"; then
                echo "= ${BASENAME}.zh.md ($TYPE, ZH) unchanged"
              else
                mv "$TMP_ZH" "$TARGET_ZH"
                echo "✓ ${BASENAME}.zh.md ($TYPE, ZH) updated"
              fi
            else
              echo "⚠ ZH not ready for ${week_start} (may not be translated yet)"
              rm -f "$TMP_ZH"
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/protocols/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "chore(protocols): sync from API (3 languages) — ${CHANGED} [skip ci]"
          git push
