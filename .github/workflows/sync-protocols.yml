name: Sync protocols (dual-sync)

on:
  schedule:
    - cron: "0 14 * * 1"
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout collector
        uses: actions/checkout@v5
        with:
          path: collector

      - name: Checkout archive
        uses: actions/checkout@v5
        with:
          repository: VQQLK/human-ai-monitor-archive
          token: ${{ secrets.HUMAN_AI_MONITOR_ARCHIVE_SYNC }}
          path: archive

      - name: Fetch list of protocols
        id: list
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          curl -sSf "$API/protocols" -o /tmp/protocols.json
          PAIRS=$(jq -r '.protocols[] | "\(.week_start) \(.week_end) \(.is_interim // 0)"' /tmp/protocols.json)
          PAIRS_ENCODED=$(echo "$PAIRS" | base64 -w 0)
          echo "pairs=$PAIRS_ENCODED" >> "$GITHUB_OUTPUT"
          LATEST_FINAL=$(echo "$PAIRS" | awk '$3 == "0" {print $1}' | sort -r | head -1)
          LATEST_INTERIM=$(echo "$PAIRS" | awk '$3 == "1" {print $1}' | sort -r | head -1)
          echo "latest_final=$LATEST_FINAL" >> "$GITHUB_OUTPUT"
          echo "latest_interim=$LATEST_INTERIM" >> "$GITHUB_OUTPUT"
          echo "Final: $LATEST_FINAL, Interim: $LATEST_INTERIM"

      - name: Sync ALL to archive
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          mkdir -p archive/protocols
          cd archive/protocols
          PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
          echo "$PAIRS" | while read -r week_start week_end is_interim; do
            [ -z "$week_start" ] && continue
            if [ "$is_interim" = "1" ]; then BASENAME="${week_end}.interim"; else BASENAME="${week_end}"; fi
            for lang in "" ".ru" ".zh"; do
              [ -z "$lang" ] && URL="$API/protocols/${week_start}/content" || URL="$API/protocols/${week_start}/content/${lang}"
              TMP="$(mktemp)"
              if curl -sSf "$URL" -o "$TMP"; then
                TARGET="${BASENAME}${lang}.md"
                if [ -f "$TARGET" ] && cmp -s "$TMP" "$TARGET"; then echo "= $TARGET unchanged"
                else mv "$TMP" "$TARGET"; echo "✓ $TARGET updated"; fi
              else rm -f "$TMP"; fi
            done
          done

      - name: Sync LATEST to collector
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          cd collector/data/protocols
          LF="${{ steps.list.outputs.latest_final }}"
          LI="${{ steps.list.outputs.latest_interim }}"
          echo "Latest FINAL: $LF, Latest INTERIM: $LI"
          
          # Build list of expected files (basenames that should exist)
          EXPECTED_FILES=""
          for ws in "$LF" "$LI"; do
            [ -z "$ws" ] && continue
            PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
            read -r _ we is_interim <<< "$(echo "$PAIRS" | grep "^$ws ")"
            [ "$is_interim" = "1" ] && BASENAME="${we}.interim" || BASENAME="${we}"
            EXPECTED_FILES="$EXPECTED_FILES ${BASENAME}.md ${BASENAME}.ru.md ${BASENAME}.zh.md"
          done
          echo "Expected files: $EXPECTED_FILES"
          
          # Remove old protocol files that should no longer be in collector
          for f in *.md; do
            [ "$f" = "README.md" ] && continue
            [ -f "$f" ] || continue
            if ! echo "$EXPECTED_FILES" | grep -q " $f"; then
              echo "Removing outdated: $f"
              rm -f "$f"
            fi
          done
          
          # Download each expected file safely (temp file, only replace on success)
          for ws in "$LF" "$LI"; do
            [ -z "$ws" ] && continue
            PAIRS=$(echo "${{ steps.list.outputs.pairs }}" | base64 -d)
            read -r _ we is_interim <<< "$(echo "$PAIRS" | grep "^$ws ")"
            [ "$is_interim" = "1" ] && BASENAME="${we}.interim" || BASENAME="${we}"
            for lang in "" ".ru" ".zh"; do
              [ -z "$lang" ] && URL="$API/protocols/${ws}/content" || URL="$API/protocols/${ws}/content/${lang}"
              TARGET="${BASENAME}${lang}.md"
              TMP=$(mktemp)
              if curl -sSf "$URL" -o "$TMP" 2>/dev/null; then
                mv "$TMP" "$TARGET"
                echo "✓ $TARGET"
              else
                rm -f "$TMP"
                if [ -f "$TARGET" ]; then
                  echo "⚠ $TARGET: download failed, keeping existing"
                else
                  echo "⚠ $TARGET: download failed, no existing file"
                fi
              fi
            done
          done
          ls -la

      - name: Commit archive
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocols/
          git diff --cached --quiet && exit 0
          git commit -m "chore: archive update [skip ci]"
          git push

      - name: Commit collector
        working-directory: collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/protocols/
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync latest [skip ci]"
          git push
