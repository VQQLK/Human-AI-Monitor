name: live-monitor

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Fetch live health
        run: curl -sfS --max-time 30 --retry 2 --retry-delay 5 https://human-ai-monitor-collector.human-ai-monitor.workers.dev/health | tee /tmp/health.json
      - name: Assert live invariants
        run: |
          set -e
          VERSION_GIT=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          jq -e --arg v "$VERSION_GIT" '
            .status == "ok" and
            .version == $v and
            (.sources_count | type == "number" and . > 0) and
            .batches_ok == true
          ' /tmp/health.json
      - name: Assert translations persisted (both known weeks)
        run: |
          set -e
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"
          WEEKS=$(curl -sfS --max-time 30 --retry 2 --retry-delay 5 "$API/protocols" | jq -r '.protocols[].week_start' | sort -u | tail -2)
          if [ -z "$WEEKS" ]; then
            echo "FAIL: no protocols returned from $API/protocols"
            exit 1
          fi
          for w in $WEEKS; do
            for lang in ru zh; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 5 "$API/protocols/$w/content/$lang")
              test "$CODE" = "200" || { echo "FAIL: $w/$lang -> $CODE (rule 7: run translate-protocols)"; exit 1; }
            done
          done
          echo "OK: translations persisted for latest weeks"
