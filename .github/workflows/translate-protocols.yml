name: Translate protocols to Russian and Chinese

on:
  schedule:
    # Monday at 13:50 UTC — 5 minutes after FINAL protocol generation (13:45 UTC)
    - cron: '50 13 * * 1'
    # Friday at 13:50 UTC — 5 minutes after INTERIM protocol generation (13:45 UTC)
    - cron: '50 13 * * 5'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to translate (YYYY-MM-DD format, Monday date). Leave empty for latest protocol.'
        required: false
        type: string

permissions: {}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Determine week to translate
        id: week
        env:
          WEEK_INPUT: ${{ github.event.inputs.week }}
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"

          if [ -n "$WEEK_INPUT" ]; then
            # Manual trigger with specific week — validate format before use.
            if ! echo "$WEEK_INPUT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Invalid week format: $WEEK_INPUT (expected YYYY-MM-DD)" >&2
              exit 1
            fi
            WEEK="$WEEK_INPUT"
            echo "Using manually specified week: $WEEK"
          else
            # Scheduled trigger — get latest protocol from API.
            WEEK=$(curl -sSf --max-time 30 --retry 2 --retry-delay 5 "$API/protocols" | jq -r '.protocols[0].week_start')
            echo "Latest protocol week: $WEEK"
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"

      - name: Trigger translation
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_SECRET_CURRENT }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"

          echo "Triggering translation for week $WEEK..."
          RESPONSE=$(curl -sSf --max-time 300 --retry 2 --retry-delay 5 -H "Authorization: Bearer $ADMIN_TOKEN" "$API/translate/$WEEK")
          echo "Response: $RESPONSE"

          # Verify translation succeeded.
          RU_BYTES=$(echo "$RESPONSE" | jq -r '.ru_bytes // 0')
          ZH_BYTES=$(echo "$RESPONSE" | jq -r '.zh_bytes // 0')

          if [ "$RU_BYTES" -gt 0 ] && [ "$ZH_BYTES" -gt 0 ]; then
            echo "✓ Translation successful: RU=$RU_BYTES bytes, ZH=$ZH_BYTES bytes"
          else
            echo "✗ Translation failed or incomplete"
            exit 1
          fi

      - name: Verify translation in database
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          API="https://human-ai-monitor-collector.human-ai-monitor.workers.dev"

          echo "Verifying Russian translation..."
          curl -sSf --max-time 90 --retry 2 --retry-delay 5 "$API/protocols/$WEEK/content/ru" | head -5

          echo ""
          echo "Verifying Chinese translation..."
          curl -sSf --max-time 90 --retry 2 --retry-delay 5 "$API/protocols/$WEEK/content/zh" | head -5
