axes:
  h1_science:
    name: Scientific Breakthroughs
    description: 'Фундаментальные открытия, медицина, космос, биология, физика'
    threshold: Устойчивый рост числа прорывных открытий (Nobel, Nature, Science)
    current: Стабильно; рост AI-assisted discoveries
    level: 0.5
    keywords:
    - science
    - discovery
    - research
    - nobel
    - nature
    - breakthrough
    sources:
    - Nature
    - Science
  h2_engineering:
    name: Engineering & Infrastructure
    description: 'Инфраструктура, энергетика, транспорт, производственные прорывы'
    threshold: Устойчивый рост инженерных проектов (мосты, энергосети, транспорт)
    current: Стабильно; AI ускоряет проектирование
    level: 0.5
    keywords:
    - engineering
    - infrastructure
    - energy
    - transportation
    - manufacturing
    sources:
    - IEEE Spectrum
    - MIT News (Engineering)
  h3_culture:
    name: Culture & Arts
    description: 'Литература, музыка, искусство, сохранение культурного наследия'
    threshold: Устойчивый рост культурных достижений и их доступности
    current: Стабильно; AI генерирует контент
    level: 0.5
    keywords:
    - culture
    - art
    - music
    - literature
    - heritage
    - creativity
    sources:
    - ArtsJournal
    - Hyperallergic
    - The Conversation
  h4_institutions:
    name: Institutions & Education
    description: 'Успехи университетов, реформы образования, международное сотрудничество'
    threshold: Устойчивый рост качества образования и институционального доверия
    current: Стабильно; AI меняет образование
    level: 0.5
    keywords:
    - university
    - education
    - institution
    - cooperation
    - reform
    sources:
    - MIT News (Engineering)
    - Inside Higher Ed
  h5_wellbeing:
    name: Wellbeing & Health
    description: 'Победы над болезнями, улучшение качества жизни, социальные инновации'
    threshold: Устойчивое снижение смертности и роста продолжительности жизни
    current: Стабильно; AI в медицине
    level: 0.5
    keywords:
    - health
    - wellbeing
    - disease
    - quality of life
    - longevity
    sources:
    - Science
    - WHO
    - Nature Medicine
  h6_governance:
    name: Governance & Rights
    description: 'Правовые победы, мирные инициативы, укрепление демократических институтов'
    threshold: Устойчивый рост доверия к институтам и защите прав
    current: Стабильно; AI в governance
    level: 0.5
    keywords:
    - governance
    - rights
    - democracy
    - rule of law
    - peace
    sources:
    - Business & Human Rights Resource Centre
    - CPJ
